interface:
  display_name: "Deep Research Workflow"
  short_description: "Autonomous or human-guided falsification-first research with deviation-aware ledgers"
  default_prompt: "Use $deep-research-workflow in the project-selected autonomous or human_guided iteration mode. For an evidence-backed plateau, inherit the pinned task instead of repeating setup: reconstruct complete scoped attempt history, search current primary papers and official projects, audit reward-hacking or harness distortion, then return one discriminating next step. Do not use plateau diagnosis for startup hardening. For a consequential proposal or surprising, contradictory, or inconclusive result, consider one independent advice branch and evidence-aware reduction before the next plan; exact Fable 5.1 is the active strong scoped route, while GPT-6 Astra is the active OpenAI route for Anthropic-family writers and remains catalog-gated. Resolve the selected route and actual-writer provider separation first; never silently substitute. When one observation and one candidate mechanism need a discriminating test rather than broad source coverage, use a bounded $generate-insight child owner; in human_guided, return its RETHINK reduction before another experiment. Test load-bearing assumptions first, preserve deviation evidence, and return the human_guided post-reduction checkpoint before replanning."
