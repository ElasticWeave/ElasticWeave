interface:
  display_name: "Fast Mode"
  short_description: "Run fast human-guided verified cycles"
  default_prompt: "Use $fast-mode for short human-guided cycles: perform a minimum viable bootstrap and dispatch the first experiment in the opening cycle, reconciling optional infrastructure only when task evidence requires it. Use at most one independent multi-model proposal or result-analysis consultation when it will prevent immediate rework or clarify the human checkpoint; exact Fable 5.1 is the active strong scoped review/advice route, while GPT-6 Astra (gpt-6-astra) is the active OpenAI route for Anthropic-family writers and a slow, high-quality xhigh option with the full 3600-second timeout. Resolve the selected route and actual-writer provider separation first; never silently substitute. Route one observation and candidate mechanism through a bounded $generate-insight native owner for at most one new verifying experiment, then return its terminal or RETHINK reduction at the human checkpoint; its stages alone do not admit a workflow. Return an evidence-backed plateau to the human first; only then, when feedback cannot supply a new discriminating direction or explicitly requests it, delegate one bounded $deep-research-workflow history/web/reward-hacking diagnosis. Never run it as startup hardening. Ordinary code or multi-file work does not itself trigger Simplify -> Verify; use the evidence/risk admission rules. Preserve real evidence and terminal review for the actual task, and give every native agent CLI turn 3600 seconds."
