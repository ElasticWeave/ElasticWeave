interface:
  display_name: "Default Mode"
  short_description: "Start autonomous work with evidence checks"
  default_prompt: "Use $default-mode to start autonomous team-leader work with a minimum viable bootstrap and the first bounded task dispatch in the opening cycle. After every real autonomous child/workflow result, emit GENERATE_INSIGHT_DECISION, reason, evidence refs, a typed insight result status, and SELF_EVOLVE_DISPOSITION with artifact/result refs; persist the gate event before ordinary replanning. Dispatch $generate-insight only for one observation plus candidate mechanism and discriminating test, use $deep-research-workflow for broad evidence gaps or a real plateau, use bounded project repair for a reproduced defect, and otherwise record not_applicable. Board or memory updates alone are not self-evolution; generalized changes require $self-improve transfer admission and independent review. Reconcile optional infrastructure only when task evidence requires it. For consequential planning proposals or ambiguous result analysis, use one bounded independent multi-model consultation and evidence-aware reduction before the next dispatch; exact Fable 5.1 is the active strong scoped review/advice route, while GPT-6 Astra (gpt-6-astra) is the active OpenAI route for Anthropic-family writers and a slow, high-quality xhigh option with the full 3600-second timeout. Resolve the selected route and actual-writer provider separation first; never silently substitute. Only after an evidence-backed plateau, delegate one $deep-research-workflow diagnosis over scoped task history, current primary papers/projects, and reward-hacking or harness distortion; never run it as startup hardening. Ordinary code or multi-file work does not itself trigger Simplify -> Verify; use the evidence/risk admission rules. Preserve real evidence and terminal review for the actual task, and give every native agent CLI turn 3600 seconds."
